{k:/(how|what|explain|measur|indicator).*db2|db2.*(indicator|measur)/,r:()=>T_('Answer','<p>Db2 health is judged from a small set of indicators taken from the Db2 statistics and accounting records (SMF 100 and 101):</p><ul><li><b>Buffer pool hit ratio</b> – how often pages are found in memory. Low values mean extra disk reads.</li><li><b>Active threads against the limit</b> – close to the limit, new work queues.</li><li><b>Deadlocks, timeouts and lock escalations</b> – contention between applications.</li><li><b>Synchronous read latency</b> – the time an application waits for a disk read.</li><li><b>Active log used and log offload</b> – a full active log can stall updates.</li><li><b>DDF requests queued</b> – remote requests waiting for a thread.</li><li><b>EDM pool and DBM1 storage</b> – memory pressure inside the subsystem.</li></ul><p>Each indicator has a warning and a critical limit; yellow and red follow those limits.</p>',{go:[['Open Db2 health',{tab:'health',hv:'db2'}]],steps:['Open <b>System Health</b>.','Choose <b>Db2</b> at the top.']})},

{k:/circle|yellow|red|green|status colou?r/,r:()=>T_('Answer',`<p>Each KPI has one circle, judged against its own two limits:</p><ul><li><span class="dot d2"></span> <b>Healthy</b> – inside the warning limit.</li><li><span class="dot d1"></span> <b>Warning</b> – past the warning limit, worth watching.</li><li><span class="dot d0"></span> <b>Critical</b> – past the critical limit, look into it.</li><li><span class="dot d3"></span> <b>No data</b> – nothing measured for this selection.</li></ul><p>For utilization the limits are ${CFG.thr[0]}% and ${CFG.thr[1]}% of capacity. A stressed component does not turn system availability red: availability and stress are separate questions.</p>`)},
{k:/explain.*(cpc|lpar|sysplex)|difference.*(cpc|lpar)|hierarch|what is (a )?(cpc|lpar|sysplex)/,r:()=>T_('Answer','<p>The portal follows how a mainframe is built:</p><ul><li><b>CPC</b> – the physical machine. It has a fixed capacity.</li><li><b>LPAR</b> – a logical partition of a CPC. Each LPAR runs its own z/OS and is a member of one sysplex.</li><li><b>Sysplex</b> – a group of LPARs working together, possibly on different CPCs, such as Prodplex or Testplex.</li><li><b>Workload</b> – the kind of work on an LPAR: CICS, Db2, TSO, started tasks, batch and system. WLM service classes are a separate grouping of the same work.</li><li><b>Region, job class or address-space group</b> – CICS regions, the Db2 address spaces (DBM1, DIST, MSTR, IRLM), TSO users, started tasks, and batch job classes. Under them you see CICS transactions, Db2 plans, TSO users, batch jobs and messages.</li></ul><p>The path is Installation, CPC, LPAR, workload, then the group. A sysplex is not a level: it groups LPARs that may sit on different CPCs, and an environment (Production, Test, Development) is a business label you configure.</p>',{go:[['Open Capacity & Workload',{tab:'cap'}]]})},
